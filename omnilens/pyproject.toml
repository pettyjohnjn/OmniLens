[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnilens"
version = "0.3.0"
description = "Scalable lens-based interpretability for large language models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Jordan Pettyjohn", email = "pettyjohnjn@gmail.com" },
]
keywords = [
    "interpretability",
    "transformers",
    "lens",
    "lora",
    "mechanistic-interpretability",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "numpy>=1.24",
    "datasets>=2.0.0",
    "huggingface-hub>=0.23.0",
    "simple-parsing>=0.1.5",
    "torchdata>=0.7.0",
    # Modular sub-packages
    "hookbox",
    "subset-kl",
]

[project.optional-dependencies]
cuda = [
    "indexed_logits_cuda",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
all = [
    "omnilens[cuda,dev]",
]

[project.urls]
Homepage = "https://github.com/pettyjohnjn/OmniLens"
Repository = "https://github.com/pettyjohnjn/OmniLens"
Issues = "https://github.com/pettyjohnjn/OmniLens/issues"

[project.scripts]
omnilens = "omnilens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
