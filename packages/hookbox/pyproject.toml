[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hookbox"
version = "0.1.0"
description = "A utility library for capturing and transforming activations in PyTorch models"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Jordan Pettyjohn", email = "pettyjohnjn@gmail.com" },
]
keywords = [
    "pytorch",
    "hooks",
    "activations",
    "transformers", 
    "interpretability",
    "mechanistic-interpretability",
    "activation-patching",
    "probing",
    "distributed",
    "fsdp",
    "ddp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "torch>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "transformers>=4.20.0",  # For testing with HF models
]
transformers = [
    "transformers>=4.20.0",
]

[project.urls]
Homepage = "https://github.com/pettyjohnjn/hookbox"
Documentation = "https://github.com/pettyjohnjn/hookbox#readme"
Repository = "https://github.com/pettyjohnjn/hookbox"
Issues = "https://github.com/pettyjohnjn/hookbox/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["hookbox*"]

[tool.setuptools.package-data]
hookbox = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "distributed: marks tests that require distributed setup",
    "slow: marks tests as slow",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled separately

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
